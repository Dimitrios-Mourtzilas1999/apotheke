{% if pages > 1 %}
<nav class="mt-4">
    <ul class="pagination justify-content-center">

        <!-- Previous -->
        <li class="page-item {% if page <= 1 %}disabled{% endif %}">
            <a class="page-link" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page|add:'-1' }}">&laquo;</a>
        </li>

        <!-- Page numbers -->
        {% for p in page_numbers %}
        <li class="page-item {% if p == page %}active{% endif %}">
            <a class="page-link" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ p }}">{{ p }}</a>
        </li>
        {% endfor %}

        <!-- Next -->
        <li class="page-item {% if page >= pages %}disabled{% endif %}">
            <a class="page-link" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}page={{ page|add:'1' }}">&raquo;</a>
        </li>

    </ul>
</nav>
{% endif %}
