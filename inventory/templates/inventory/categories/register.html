{% extends "base.html" %}{% load static %}

{% block css %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{% static 'css/menu.css' %}">
<link rel="stylesheet" href="{% static 'inventory/categories/css/register_category.css' %}">
{% endblock %}

{% block content %}
{% include "menu.html" %}

<form action="{% url 'category_register' %}" method="POST">
  {% csrf_token %}

  <label for="{{ form.category_type.id_for_label }}">{{ form.category_type.label }}</label>
  {{ form.category_type }}
  {% include "field_errors.html" with field=form.category_type %}

  <button type="submit">Καταχώρηση</button>
</form>
{% endblock %}
