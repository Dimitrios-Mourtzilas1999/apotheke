{% extends "base.html" %}{% load static %}

{% block css %}
<link rel="stylesheet" href="{% static 'inventory/categories/css/register_category.css' %}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{% static 'css/menu.css' %}">
{% endblock %}

{% block content %}
{% include 'menu.html' %}

<div class="main-content">
  <form action="{% url 'category_register' %}" method="POST" class="category-register-form">
    {% csrf_token %}

    <h4 class="form-title">Καταχώρηση Κατηγορίας</h4>

    <div class="form-group">
        <label for="{{ form.category_type.id_for_label }}" class="form-label">{{ form.category_type.label }}</label>
        {{ form.category_type }}
        {% include "field_errors.html" with field=form.category_type %}
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-save"></i> Καταχώρηση
        </button>
        <a href="{% url 'category_list' %}" class="btn btn-secondary">
            <i class="fa-solid fa-arrow-left"></i> Πίσω
        </a>
    </div>
  </form>
</div>
{% endblock %}
