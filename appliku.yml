build_settings:
  build_image: python-3.12
  build_command: "pip install -r requirements.txt && python manage.py collectstatic --noinput --clear"
  container_port: 8000
  environment_variables:
    - name: DEBUG
      value: "false"
    - name: DATABASE_URL
      from_database:
        name: db
        property: connection_url
    - name: ALLOWED_HOSTS
      from_domains: true
    - name: SECRET_KEY
      source: manual
    - name: LOG_LEVEL
      value: "INFO"
    - name: DISABLE_COLLECTSTATIC
      value: "1"

services:
  web:
    command: "gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 120"
    scale: 1

  release:
    command: "python -c \"import os; print('DATABASE_URL:', os.environ.get('DATABASE_URL', 'NOT SET'))\" && python manage.py migrate --fake-initial --noinput"

databases:
  db:
    type: mysql_8

volumes:
  media:
    target: /app/media/
    url: /media/
    environment_variable: MEDIA_ROOT
