build_settings:
  build_image: python-3.12
  build_command: "pip install -r requirements.txt"
  container_port: 8000
  environment_variables:
    - name: DEBUG
      value: "false"
    - name: DATABASE_URL
      from_database:
        name: db
        property: connection_url
    - name: ALLOWED_HOSTS
      from_domains: true
    - name: SECRET_KEY
      source: manual
    - name: LOG_LEVEL
      value: "INFO"

services:
  web:
    command: "mkdir -p /app/media/qrcodes && chmod -R 777 /app/media && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 120"
    scale: 1

  release:
    command: "python manage.py collectstatic --noinput --clear && python manage.py migrate --fake-initial --noinput"

databases:
  db:
    type: mysql_8
